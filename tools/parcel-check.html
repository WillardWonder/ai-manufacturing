        body { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
        .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        header { text-align: center; }
        h1 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
        .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

        .map-hint { position: absolute; left: 8px; bottom: 8px; z-index: 500; max-width: calc(100% - 16px);
            background: rgba(15, 23, 42, .88); color: var(--text); font-size: 12px; padding: 4px 8px; border-radius: 6px; }
        button { font: inherit; border: 0; border-radius: 10px; cursor: pointer; }
        button:disabled { opacity: .55; cursor: default; }
        .btn-primary { width: 100%; padding: 14px; background: var(--gold); color: #0F172A; font-weight: 700; font-size: 16px; }
        .btn-secondary { padding: 0 16px; background: var(--line); color: var(--text); font-weight: 600; }
        .btn-ghost { width: 100%; padding: 11px; margin-top: 12px; background: transparent; color: var(--gold);
            border: 1px solid var(--gold); font-weight: 600; }
        .row { display: flex; gap: 8px; }
        input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
            background: var(--panel); color: var(--text); font: inherit; }
        input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
        .badge { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
            font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
        #status { min-height: 19px; font-size: 13px; text-align: center; color: var(--muted); }
        #status.err { color: var(--err); }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
        .card-kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
        .card-title { margin: 2px 0 0; font-size: 20px; font-weight: 700; word-break: break-all; }
        .card-sub { color: var(--muted); font-size: 13px; }
        .banner { border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 10px; border: 1px solid; }
        .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
        .banner.info { background: var(--info-bg); border-color: var(--info-line); color: #BAE6FD; }
        .banner.err { background: var(--err-bg); border-color: var(--err); color: #FECACA; }
        .section { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold);
            margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
        dl { display: grid; grid-template-columns: minmax(118px, 42%) 1fr; gap: 6px 12px; margin: 0; }
        dt { color: var(--muted); font-size: 13px; }
        dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
        .pending { color: var(--warn); font-style: italic; font-size: 13px; }
        .pick { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 10px 12px;
            background: var(--bg); color: var(--text); border: 1px solid var(--line); font-size: 14px; }
        .pick small { display: block; color: var(--muted); }
        .ai { white-space: pre-wrap; font-size: 14px; }
        .fine { font-size: 12px; color: var(--muted); margin-top: 6px; }
        .hidden { display: none !important; }
        .sig { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; margin: 6px 0; }
        .sig-icon { font-weight: 700; text-align: center; }
        .sig-yes { color: #4ADE80; } .sig-no { color: var(--muted); } .sig-unk { color: var(--warn); }
        .sig-detail { grid-column: 2; font-size: 13px; color: var(--muted); }
        .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; background: var(--bg); }
        .item-title { font-weight: 600; }
        .item-meta { font-size: 13px; color: var(--muted); }
        .loading { color: var(--muted); font-size: 13px; padding: 10px 0; }
        details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 8px; }
        a { color: var(--sel); }

    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    let res, text;
    try {
        res = await fetch(url, { ...options, signal: ctl.signal });
        text = await res.text();
    } catch (e) {
        throw new Error(e.name === 'AbortError'
            ? `${label} did not respond within ${timeoutMs / 1000} s.`
            : `${label} unreachable: ${e.message}`);
    } finally {
        clearTimeout(timer);
    }
    let data;
    try {
        data = text ? JSON.parse(text) : {};
    } catch {
        throw new Error(`${label} returned HTTP ${res.status} with a non-JSON body: ${text.slice(0, 160)}`);
    }
    if (!res.ok) {
        const msg = (data && (data.error && data.error.message || data.message)) || text.slice(0, 160);
        throw new Error(`${label} returned HTTP ${res.status}: ${msg}`);
    }
    if (data && data.error) {
        const detail = (data.error.details || []).join(' ');
        throw new Error(`${label} error ${data.error.code || ''}: ${data.error.message}${detail ? ' (' + detail + ')' : ''}`);
    }
    return data;
}

module.exports = { fetchJson };

"geo":function(module,exports,require){
'use strict';

// Minimal geometry helpers for GeoJSON Polygon / MultiPolygon in WGS84.

const M_PER_DEG = 111320;

function polygonsOf(g) {
    if (!g) return [];
    if (g.type === 'Polygon') return [g.coordinates];
    if (g.type === 'MultiPolygon') return g.coordinates;
    return [];
}

function bbox(g) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const poly of polygonsOf(g)) for (const ring of poly) for (const [x, y] of ring) {
        if (x < minX) minX = x; if (y < minY) minY = y;
        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
    }
    if (!Number.isFinite(minX)) throw new Error('Parcel has no polygon geometry.');
    return [minX, minY, maxX, maxY];
}

function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
}

function pointInGeometry(x, y, g) {
    return polygonsOf(g).some(([outer, ...holes]) => inRing(x, y, outer) && !holes.some(h => inRing(x, y, h)));
}

// Approximate distance in meters from a point to the polygon boundary (0 if inside).
function distanceMeters(x, y, g) {
    if (pointInGeometry(x, y, g)) return 0;
    const kx = M_PER_DEG * Math.cos(y * Math.PI / 180), ky = M_PER_DEG;
    let best = Infinity;
    for (const poly of polygonsOf(g)) for (const ring of poly) {
        for (let i = 0; i < ring.length - 1; i++) {
            const ax = (ring[i][0] - x) * kx, ay = (ring[i][1] - y) * ky;
            const bx = (ring[i + 1][0] - x) * kx, by = (ring[i + 1][1] - y) * ky;
            const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
            const t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
            const px = ax + t * dx, py = ay + t * dy;
            best = Math.min(best, Math.hypot(px, py));
        }
    }
    return best;
}

function expandBbox([minX, minY, maxX, maxY], meters) {
    const midLat = (minY + maxY) / 2;
    const dLat = meters / M_PER_DEG, dLng = meters / (M_PER_DEG * Math.cos(midLat * Math.PI / 180));
    return [minX - dLng, minY - dLat, maxX + dLng, maxY + dLat];
}

// WKT for SQL Server geometry::STGeomFromText. Numbers fixed to 7 decimals
// (~1 cm), so no exponent notation and no injectable characters.
function toWkt(g) {
    const polys = polygonsOf(g);
    if (!polys.length) throw new Error('Parcel has no polygon geometry.');
    const ring = r => '(' + r.map(([x, y]) => `${Number(x).toFixed(7)} ${Number(y).toFixed(7)}`).join(', ') + ')';
    const poly = p => '(' + p.map(ring).join(', ') + ')';
    return polys.length === 1 ? 'POLYGON' + poly(polys[0]) : 'MULTIPOLYGON(' + polys.map(poly).join(', ') + ')';
}

module.exports = { bbox, pointInGeometry, distanceMeters, expandBbox, toWkt };

"plss":function(module,exports,require){
'use strict';

// Approximate WGS84 location of a Wisconsin PLSS section center.
// Townships count north from the WI-IL baseline (42.5 N); ranges count
// east/west from the 4th Principal Meridian (90 25' 37" W). Townships are
// 6 miles square; sections are numbered boustrophedon from the NE corner.
// Surveyed lines drift from this ideal grid, so expect ~0.5-1.5 km error:
// fine for "comps within N miles", not for boundaries.

const BASELINE_LAT = 42.5;
const PM_LNG = -(90 + 25 / 60 + 37 / 3600);
const TOWNSHIP_M = 9656.064;
const M_PER_DEG_LAT = 111132;

function sectionCenter(section, township, range, meridian) {
    const s = Number(section), t = Number(township), r = Number(range);
    if (!(s >= 1 && s <= 36) || !(t >= 1) || !(r >= 1)) return null;
    const dir = String(meridian || '').toUpperCase().startsWith('W') ? -1 : 1;
    const row = Math.floor((s - 1) / 6);                     // 0 = north row
    const col = row % 2 === 0 ? 5 - ((s - 1) % 6) : (s - 1) % 6;  // 0 = west column
    const northM = (t - 1) * TOWNSHIP_M + (5 - row + 0.5) / 6 * TOWNSHIP_M;
    const lat = BASELINE_LAT + northM / M_PER_DEG_LAT;
    const eastM = dir > 0 ? (r - 1) * TOWNSHIP_M + (col + 0.5) / 6 * TOWNSHIP_M
                          : -(r * TOWNSHIP_M) + (col + 0.5) / 6 * TOWNSHIP_M;
    const lng = PM_LNG + eastM / (111320 * Math.cos(lat * Math.PI / 180));
    return { lat, lng };
}

module.exports = { sectionCenter };

},
"parcel":function(module,exports,require){
'use strict';

// Re-fetch the parcel by OBJECTID from the statewide layer, so every
// downstream lookup runs on the authoritative record and geometry rather
// than on anything the browser sends.

const PARCEL_SVC = 'https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query';

async function fetchParcel(objectId) {

"ownership":function(module,exports,require){
'use strict';

// Absentee-owner check from the county record alone: mailing address
// (PSTLADRESS) vs. site address (SITEADRESS), plus improvement value.

const SUFFIXES = new Set(['RD', 'ROAD', 'ST', 'STREET', 'AVE', 'AVENUE', 'LN', 'LANE', 'DR', 'DRIVE', 'CT', 'COURT',
    'HWY', 'HIGHWAY', 'CTY', 'COUNTY', 'TRL', 'TRAIL', 'BLVD', 'PL', 'CIR', 'WAY', 'N', 'S', 'E', 'W', 'RR']);

const norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function mailingStateZip(addr) {
    const m = norm(addr).match(/\b([A-Z]{2}) (\d{5})(?: \d{4})?$/);
    return m ? { state: m[1], zip: m[2] } : null;
}

// Same house number and at least one shared street-name word.
function sameStreetAddress(site, mail) {
    const s = norm(site).split(' '), m = norm(mail).split(' ');
    if (!s.length || !m.length) return null;
    if (/\d/.test(s[0]) && /\d/.test(m[0])) {
        if (s[0] !== m[0]) return false;
        const words = new Set(s.slice(1).filter(w => w.length > 1 && !SUFFIXES.has(w)));
        return words.size === 0 ? true : m.slice(1).some(w => words.has(w));
    }
    return norm(mail).startsWith(norm(site)) ? true : null;
}

function analyzeOwnership(p) {
    const mail = norm(p.PSTLADRESS), site = norm(p.SITEADRESS);
    const improved = Number(p.IMPVALUE) > 0;
    const loc = mailingStateZip(p.PSTLADRESS);
    const base = { mailingAddress: p.PSTLADRESS || null, siteAddress: p.SITEADRESS || null, mailingState: loc && loc.state };

    if (!mail) {
        return { ...base, status: 'unknown', label: 'Cannot determine', reasons: ['No mailing address on the county record.'] };
    }
    if (loc && loc.state !== 'WI') {
        return { ...base, status: 'absentee', label: `Absentee (out of state: ${loc.state})`, reasons: [`Tax bill mails to ${loc.state}.`] };
    }
    if (site) {
        const same = sameStreetAddress(site, mail);
        if (same === true) return { ...base, status: 'resident', label: 'Likely owner-occupied', reasons: ['Mailing address matches the site address.'] };
        if (same === false) return { ...base, status: 'absentee', label: 'Absentee (in state)', reasons: ['Mailing address differs from the site address.'] };
        return { ...base, status: 'unknown', label: 'Cannot determine', reasons: ['Site and mailing addresses could not be compared reliably.'] };
    }
    if (!improved) {
        return { ...base, status: 'absentee', label: 'Absentee (vacant land)',
            reasons: ['No site address and no improvement value on record, so no residence exists on this parcel.'] };
    }
    return { ...base, status: 'unknown', label: 'Cannot determine', reasons: ['Improvements are recorded but there is no site address to compare.'] };
}

module.exports = { analyzeOwnership, sameStreetAddress, mailingStateZip };

},
"mfl":function(module,exports,require){
'use strict';

// Managed Forest Law / Forest Crop Law enrollment from the WI DNR
// "Wisconsin Tax Law Points" layer. Each point is one enrolled PLSS
// quarter-quarter (QQ), placed at the QQ center, not on the exact land.
// A QQ is ~400 m square, so any QQ touching the parcel has its point within
// ~285 m of the parcel; a 300 m search catches all of them.

const { fetchJson } = require('./http');
const { bbox, expandBbox, pointInGeometry, distanceMeters } = require('./geo');

const TAXLAW_SVC = 'https://services5.arcgis.com/Ul9AyFFeFTjf08DW/arcgis/rest/services/X13661_FR_GIS_TAXLAW_PT_SV/FeatureServer/0/query';
const SEARCH_M = 300;
const MATCH_RANK = { 'parcel number': 2, 'location': 1 };

const idNorm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function parcelIdsMatch(a, b) {
    a = idNorm(a); b = idNorm(b);
    if (!a || !b) return false;
    if (a === b) return true;
    const [short, long] = a.length < b.length ? [a, b] : [b, a];
    return short.length >= 7 && long.endsWith(short);
}
const expirationYear = (s) => { const m = String(s || '').match(/(\d{4})\s*$/); return m ? Number(m[1]) : null; };
const num = (v) => (v === null || v === undefined || v === '' || !Number.isFinite(Number(v))) ? null : Number(v);
const ACCESS = { O: 'Open to public', C: 'Closed to public' };

async function lookupTaxLaw(parcel, { now = new Date() } = {}) {
    const p = parcel.properties, g = parcel.geometry;
    const box = expandBbox(bbox(g), SEARCH_M);
    const params = new URLSearchParams({
        geometry: box.map(n => n.toFixed(7)).join(','), geometryType: 'esriGeometryEnvelope',
        inSR: '4326', outSR: '4326', spatialRel: 'esriSpatialRelIntersects',
        outFields: '*', returnGeometry: 'true', resultRecordCount: '500', f: 'json'
    });
    const data = await fetchJson(`${TAXLAW_SVC}?${params}`, {}, { label: 'DNR tax-law service' });
    if (!Array.isArray(data.features)) throw new Error('DNR tax-law service returned an unexpected response.');

    const county = String(p.CONAME || '').toUpperCase();
    const year = now.getFullYear();
    const orders = new Map();

    for (const f of data.features) {
        const a = f.attributes || {}, x = f.geometry && f.geometry.x, y = f.geometry && f.geometry.y;
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        const sameCounty = !county || !a.CNTY_NAME || String(a.CNTY_NAME).toUpperCase() === county;
        const idMatch = sameCounty && [p.PARCELID, p.TAXPARCELID].some(id => parcelIdsMatch(a.PARCEL_NO, id));
        const match = idMatch ? 'parcel number' : pointInGeometry(x, y, g) ? 'location' : null;
        const dist = Math.round(distanceMeters(x, y, g));

        const key = a.ORDER_NO || `FID-${a.FID}`;
        if (!orders.has(key)) {
            const expYear = expirationYear(a.ORDER_EXP);
            orders.set(key, {
                orderNo: a.ORDER_NO || null, program: a.TAX_TYPE || null, county: a.CNTY_NAME || null,
                entryYear: a.ENTRY_YEAR || null, expires: a.ORDER_EXP || null, expirationYear: expYear,
                yearsRemaining: expYear ? expYear - year : null, ownerType: a.OWNER_TEXT || null,
                orderAcres: { open: num(a.AC_OP_ORD), closed: num(a.AC_CL_ORD), total: num(a.AC_TOT_ORD) },
                match: null, nearestMeters: dist, tracts: []
            });
        }
        const o = orders.get(key);
        if (match && (!o.match || MATCH_RANK[match] > MATCH_RANK[o.match])) o.match = match;
        o.nearestMeters = Math.min(o.nearestMeters, dist);
        o.tracts.push({ description: a.DTRSLD_TXT || a.LEGAL_DESC || null, countyParcelNo: a.PARCEL_NO || null,
            acres: num(a.AC_TOT_PLS), access: ACCESS[a.ACCESS] || a.ACCESS || null, match, distanceMeters: dist });
    }

    const all = [...orders.values()];
    const matched = all.filter(o => o.match).sort((a, b) => MATCH_RANK[b.match] - MATCH_RANK[a.match]);
    const nearby = all.filter(o => !o.match).sort((a, b) => a.nearestMeters - b.nearestMeters).slice(0, 5);
    return {
        status: matched.length ? 'enrolled' : 'none_found',
        matched, nearby, searchRadiusMeters: SEARCH_M,
        truncated: Boolean(data.exceededTransferLimit),
        method: 'DNR tax-law points mark enrolled quarter-quarters at their center. Matched by county parcel number, or by the point falling inside this parcel.'
    };
}

module.exports = { lookupTaxLaw, parcelIdsMatch, expirationYear, TAXLAW_SVC };

},
"soils":function(module,exports,require){
'use strict';

// Soils and forest productivity from USDA NRCS Soil Data Access (SSURGO).
// 1) Clip soil map units to the parcel polygon to get acres per map unit.
// 2) Pull components and forest-productivity ratings (coforprod) for them.
// 3) Area-weight site index by species, in code.

const { fetchJson } = require('./http');
const { toWkt } = require('./geo');

const SDA_URL = 'https://sdmdataaccess.sc.egov.usda.gov/Tabular/post.rest';
const SQ_M_TO_ACRES = 0.000247105;

async function sda(query) {
    const data = await fetchJson(SDA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, format: 'JSON+COLUMNNAME' })
    }, { label: 'USDA Soil Data Access', timeoutMs: 15000 });
    const table = data.Table;
    if (!Array.isArray(table) || table.length < 1) return [];
    const [cols, ...rows] = table;
    return rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]])));
}

const num = (v) => (v === null || v === undefined || v === '' || !Number.isFinite(Number(v))) ? null : Number(v);
const round = (v, d = 1) => v === null ? null : Math.round(v * 10 ** d) / 10 ** d;

function clipQuery(wkt) {
    return `~DeclareGeometry(@aoi)~
select @aoi = geometry::STGeomFromText('${wkt}', 4326).MakeValid()
~DeclareIdGeomTable(@intersectedPolygonGeometries)~
~GetClippedMapunits(@aoi,polygon,geo,@intersectedPolygonGeometries)~
~DeclareIdGeogTable(@intersectedPolygonGeographies)~
~GetGeogFromGeomWgs84(@intersectedPolygonGeometries,@intersectedPolygonGeographies)~
select id as mukey, sum(geog.STArea()) * ${SQ_M_TO_ACRES} as acres
from @intersectedPolygonGeographies group by id`;
}

function attributeQuery(mukeys) {
    return `select mu.mukey, mu.musym, mu.muname, ma.drclassdcd,
  c.cokey, c.compname, c.comppct_r, c.majcompflag,
  fp.plantsym, fp.plantcomname, fp.siteindexbase, fp.siteindex_r, fp.fprod_r
from mapunit mu
left join muaggatt ma on ma.mukey = mu.mukey
inner join component c on c.mukey = mu.mukey
left join coforprod fp on fp.cokey = c.cokey
where mu.mukey in (${mukeys.join(',')})
order by mu.mukey, c.comppct_r desc`;
}

async function lookupSoils(parcel) {
    const wkt = toWkt(parcel.geometry);
    let acresByMukey = null, clipError = null, mukeys;

    try {
        const rows = await sda(clipQuery(wkt));
        acresByMukey = new Map(rows.map(r => [String(r.mukey), num(r.acres)]));
        mukeys = [...acresByMukey.keys()];
    } catch (e) {
        // Fall back to map unit list without acreage rather than nothing.
        clipError = e.message;
        const rows = await sda(`select distinct mukey from SDA_Get_Mukey_from_intersection_with_WktWgs84('${wkt}')`);
        mukeys = rows.map(r => String(r.mukey));
    }
    mukeys = mukeys.filter(k => /^\d{1,12}$/.test(k));
    if (!mukeys.length) {
        return { status: 'none', units: [], productivity: [], totalAcres: 0,
            note: 'No SSURGO soil map units intersect this parcel (open water or unsurveyed area).' };
    }

    const rows = await sda(attributeQuery(mukeys));
    const units = new Map();
    for (const r of rows) {
        const key = String(r.mukey);
        if (!units.has(key)) {
            units.set(key, { mukey: key, symbol: r.musym || null, name: r.muname || null, drainage: r.drclassdcd || null,
                acres: acresByMukey ? round(acresByMukey.get(key), 2) : null, components: new Map() });
        }
        const u = units.get(key);
        if (!u.components.has(r.cokey)) {
            u.components.set(r.cokey, { name: r.compname || null, percent: num(r.comppct_r),
                major: r.majcompflag === 'Yes', siteIndex: [] });
        }
        const si = num(r.siteindex_r);
        if (si !== null) {
            u.components.get(r.cokey).siteIndex.push({ species: r.plantcomname || r.plantsym || null, symbol: r.plantsym || null,
                siteIndex: si, method: r.siteindexbase || null, productivityFt3AcYr: num(r.fprod_r) });
        }
    }

    const list = [...units.values()].map(u => ({ ...u, components: [...u.components.values()] }));
    const totalAcres = acresByMukey ? round(list.reduce((s, u) => s + (u.acres || 0), 0), 2) : null;
    for (const u of list) u.percentOfParcel = totalAcres ? round(100 * (u.acres || 0) / totalAcres, 1) : null;
    list.sort((a, b) => (b.acres || 0) - (a.acres || 0));

    // Area-weighted site index per species and method (different methods
    // are not comparable, so they are kept separate). weight = map unit
    // acres x component percent.
    const productivity = [];
    if (acresByMukey) {
        const agg = new Map();
        for (const u of list) for (const c of u.components) for (const s of c.siteIndex) {
            const w = (u.acres || 0) * (c.percent || 0) / 100;
            if (!w) continue;
            const k = `${s.symbol}|${s.method}`;
            const a = agg.get(k) || { species: s.species, symbol: s.symbol, method: s.method, w: 0, si: 0, fw: 0, fp: 0 };
            a.w += w; a.si += w * s.siteIndex;
            if (s.productivityFt3AcYr !== null) { a.fw += w; a.fp += w * s.productivityFt3AcYr; }
            agg.set(k, a);
        }
        for (const a of agg.values()) {
            productivity.push({ species: a.species, symbol: a.symbol, method: a.method,
                siteIndex: Math.round(a.si / a.w), ratedAcres: round(a.w, 1),
                productivityFt3AcYr: a.fw ? Math.round(a.fp / a.fw) : null });
        }
        productivity.sort((a, b) => b.ratedAcres - a.ratedAcres);
    }

    return {
        status: acresByMukey ? 'ok' : 'partial',
        units: list, productivity, totalAcres,
        note: acresByMukey ? null : `Acreage by soil unit unavailable (${clipError}). Map units listed without area.`
    };
}

module.exports = { lookupSoils, clipQuery, attributeQuery, SDA_URL };

},
"comps":function(module,exports,require){
'use strict';

// Comparable land sales from data/comps.json (built from WI DOR RETR files
// by scripts/build-comps.js). Market evidence, not an appraisal: the card
// shows each sale so a forester can judge it.

const { bbox } = require('./geo');

let data;
try { data = __COMPS; } catch { data = null; }
const rows = data ? data.rows.map(r => Object.fromEntries(data.fields.map((f, i) => [f, r[i]]))) : [];

const USES = new Set(['6', '5M', '5']);           // forest, ag forest, undeveloped
const USE_LABEL = { '6': 'Productive forest', '5M': 'Agricultural forest', '5': 'Undeveloped', '4': 'Agricultural' };
const RADII_MILES = [15, 30, 50];
const MIN_COMPS = 5, MAX_COMPS = 12;

const milesBetween = (a, b) => {
    const k = Math.cos(((a.lat + b.lat) / 2) * Math.PI / 180);
    return Math.hypot((a.lat - b.lat) * 69.05, (a.lng - b.lng) * 69.17 * k);
};
function percentile(sorted, p) {
    const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
const num = (v) => (v === null || v === undefined || v === '' || !Number.isFinite(Number(v))) ? null : Number(v);

function findComps(parcel) {
    if (!data) throw new Error('Comparable sales data (data/comps.json) is not loaded.');
    const p = parcel.properties;
    const [minX, minY, maxX, maxY] = bbox(parcel.geometry);
    const subject = { lat: (minY + maxY) / 2, lng: (minX + maxX) / 2 };
    const subjectAcres = num(p.GISACRES) || num(p.DEEDACRES) || num(p.ASSDACRES);

    const pool = rows.filter(r => USES.has(r.use)).map(r => ({ ...r, distanceMiles: milesBetween(subject, r) }));
    const similarSize = (r) => !subjectAcres || (r.acres >= subjectAcres / 4 && r.acres <= subjectAcres * 4);

    let chosen = [], radius = null, sizeMatched = false;
    for (const rad of RADII_MILES) {
        const near = pool.filter(r => r.distanceMiles <= rad);
        const sized = near.filter(similarSize);
        if (sized.length >= MIN_COMPS) { chosen = sized; radius = rad; sizeMatched = Boolean(subjectAcres); break; }
        if (near.length >= MIN_COMPS || rad === RADII_MILES[RADII_MILES.length - 1]) { chosen = near; radius = rad; break; }
    }
    chosen = chosen.sort((a, b) => a.distanceMiles - b.distanceMiles).slice(0, MAX_COMPS);

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';

// ---- Config -------------------------------------------------------------
// WI Statewide Parcels (V12, 2026) hosted FeatureServer. Field names verified
// against the live layer schema.
const PARCEL_SVC = 'https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query';
const PENDING = 'Data Pending County Update';
const OVERLAY_MIN_ZOOM = 15;     // parcel lines are only drawn this close in
const MAX_GPS_RADIUS_M = 150;    // cap for the "nearby parcels" check
const DEFAULT_VIEW = [44.9591, -89.6301];

// Fields sent to the AI summary endpoint (must match api/evaluate.js).
const FACT_FIELDS = ['PARCELID', 'TAXPARCELID', 'STATEID', 'CONAME', 'PLACENAME', 'OWNERNME1', 'OWNERNME2',
    'PSTLADRESS', 'SITEADRESS', 'SCHOOLDIST', 'TAXROLLYEAR', 'PARCELDATE', 'LOADDATE', 'PARCELSRC',
    'PROPCLASS', 'AUXCLASS', 'GISACRES', 'DEEDACRES', 'ASSDACRES', 'LNDVALUE', 'IMPVALUE',
    'CNTASSDVALUE', 'MFLVALUE', 'ESTFMKVALUE', 'NETPRPTA'];

// Wis. Stat. 70.32(2)(a) general property classes, and exempt auxiliary classes.
const PROP_CLASS = { '1': 'Residential', '2': 'Commercial', '3': 'Manufacturing', '4': 'Agricultural',
    '5': 'Undeveloped', '5M': 'Agricultural forest', '6': 'Productive forest land', '7': 'Other' };
const AUX_CLASS = { 'X1': 'Exempt – Federal', 'X2': 'Exempt – State', 'X3': 'Exempt – County', 'X4': 'Exempt – Other' };

// ---- DOM / map setup ----------------------------------------------------
const $ = (id) => document.getElementById(id);

const map = L.map('map').setView(DEFAULT_VIEW, 13);
const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© OpenStreetMap contributors' });
const aerial = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Imagery © Esri' });
streets.addTo(map);
L.control.layers({ 'Streets': streets, 'Aerial': aerial }, null, { position: 'topright' }).addTo(map);

const parcelLines = L.geoJSON(null, { interactive: false,
    style: { color: '#E2B13C', weight: 1, opacity: 0.85, fill: false } }).addTo(map);
const selectedParcel = L.geoJSON(null, { interactive: false,
    style: { color: '#38BDF8', weight: 3, fillColor: '#38BDF8', fillOpacity: 0.15 } }).addTo(map);
let marker = null, accuracyCircle = null;

// ---- Helpers ------------------------------------------------------------
function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', isError);
}
function setHint(msg) {
    mapHint.textContent = msg;
    mapHint.classList.toggle('hidden', !msg);
}
function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
}
const isBlank = (v) => v === null || v === undefined || (typeof v === 'string' && v.trim() === '');
const num = (v) => (isBlank(v) || !Number.isFinite(Number(v))) ? null : Number(v);
const money = (v) => num(v) === null ? null : '$' + Math.round(num(v)).toLocaleString('en-US');
const money2 = (v) => num(v) === null ? null
    : '$' + num(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const acres = (v) => num(v) === null ? null
    : num(v).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ac';
function dateText(v) {
    if (isBlank(v)) return null;
    if (typeof v === 'number' && v > 1e11) return new Date(v).toISOString().slice(0, 10);  // epoch ms
    return String(v);
}
function classText(v, table) {
    if (isBlank(v)) return null;
    return String(v).split(/[,;]/).map(s => s.trim()).filter(Boolean).map(code => {
        const label = table[code.toUpperCase()];
        if (label) return `${code} (${label})`;
        if (table === AUX_CLASS && /^W\d/i.test(code)) return `${code} (Forest Crop / Managed Forest Law)`;
        return code;
    }).join(', ');
}
function auxCodes(p) {
    return isBlank(p.AUXCLASS) ? [] : String(p.AUXCLASS).split(/[,;]/).map(s => s.trim().toUpperCase());
}
// Geodesic polygon area (same method as turf.js), in acres.
function geometryAcres(g) {
    if (!g) return null;
    const R = 6371008.8, rad = (d) => d * Math.PI / 180;
    const ringArea = (r) => {
        let a = 0;

// never be mistaken for "no parcel here".
async function queryParcels(params, signal) {
    const url = PARCEL_SVC + '?' + new URLSearchParams({ f: 'geojson', ...params });
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error(`Parcel service returned HTTP ${res.status}.`);
    const data = await res.json();
    if (data.error) {
        const detail = (data.error.details || []).join(' ');
        throw new Error(`Parcel service error ${data.error.code}: ${data.error.message}${detail ? ' (' + detail + ')' : ''}`);
    }
    if (!Array.isArray(data.features)) throw new Error('Parcel service returned an unexpected response.');

// ---- Parcel line overlay (replaces the non-existent WMS) ---------------
let overlayCtl = null, overlayTimer = null;
function refreshOverlay() {
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(async () => {
        if (overlayCtl) overlayCtl.abort();
        if (map.getZoom() < OVERLAY_MIN_ZOOM) {
            parcelLines.clearLayers();
            setHint('Zoom in to show parcel lines');
            return;
        }
        overlayCtl = new AbortController();
        const b = map.getBounds();
        try {
            const data = await queryParcels({
                geometry: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(n => n.toFixed(6)).join(','),
                geometryType: 'esriGeometryEnvelope', inSR: '4326', outSR: '4326',
                spatialRel: 'esriSpatialRelIntersects', outFields: 'OBJECTID', returnGeometry: 'true',
                maxAllowableOffset: '0.00001', geometryPrecision: '6', resultRecordCount: '2000'
            }, overlayCtl.signal);

            parcelLines.addData(data);
            const capped = data.exceededTransferLimit || (data.properties && data.properties.exceededTransferLimit);
            setHint(capped ? 'Some parcel lines omitted. Zoom in further.' : '');
        } catch (e) {

// ---- Location lookup ----------------------------------------------------
let lookupCtl = null, lookupSeq = 0;

    } else {

}

        (accuracy ? ` · GPS ±${Math.round(accuracy)} m` : ' · dropped pin');
    selectedParcel.clearLayers();

    const id = raw.trim();

    setStatus(`Searching statewide records for ${id}…`);
    try {

    dl.append(el('dt', null, label));

    if (accuracy && accuracy > MAX_GPS_RADIUS_M) {

    loadIntel(feature, intel);

    let dl = section(c, 'Ownership');
    fact(dl, 'Owner of record', p.OWNERNME1);
    if (!isBlank(p.OWNERNME2)) fact(dl, 'Second owner', p.OWNERNME2);
    fact(dl, 'Mailing address', p.PSTLADRESS);

    dl = section(c, 'Location');
    fact(dl, 'Site address', p.SITEADRESS, 'None on record (common for woodland)');
    fact(dl, 'Municipality', p.PLACENAME);
    fact(dl, 'School district', p.SCHOOLDIST);
    if (!isBlank(p.TAXPARCELID) && p.TAXPARCELID !== p.PARCELID) fact(dl, 'Tax parcel ID', p.TAXPARCELID);
    fact(dl, 'State ID', p.STATEID);

    dl = section(c, 'Land');
    fact(dl, 'GIS acres', acres(p.GISACRES));
    const calcAcres = geometryAcres(feature.geometry);
    if (calcAcres !== null) fact(dl, 'Boundary acres (calculated)', acres(calcAcres));
    fact(dl, 'Deed acres', acres(p.DEEDACRES));
    fact(dl, 'Assessed acres', acres(p.ASSDACRES));
    fact(dl, 'Property class', classText(p.PROPCLASS, PROP_CLASS));
    fact(dl, 'Auxiliary class', classText(p.AUXCLASS, AUX_CLASS), 'None');

    dl = section(c, `Assessment${isBlank(p.TAXROLLYEAR) ? '' : ' · ' + p.TAXROLLYEAR + ' tax roll'}`);
    fact(dl, 'Land value', money(p.LNDVALUE));
    fact(dl, 'Improvement value', money(p.IMPVALUE));
    fact(dl, 'Total assessed', money(p.CNTASSDVALUE));
    if (!isBlank(p.MFLVALUE) || aux.some(a => a.startsWith('W'))) fact(dl, 'MFL value', money(p.MFLVALUE));
    fact(dl, 'Est. fair market value (assessor)', money(p.ESTFMKVALUE));
    fact(dl, 'Net property tax', money2(p.NETPRPTA));

    dl = section(c, 'Not available from public records');
    fact(dl, 'Standing timber volume', null, 'Not in public records. Requires field cruise.');

    dl = section(c, 'Provenance');
    fact(dl, 'Parcel record date', dateText(p.PARCELDATE));
    fact(dl, 'Statewide load date', dateText(p.LOADDATE));
    fact(dl, 'Source', p.PARCELSRC);
    c.append(el('div', 'fine', 'Source: Wisconsin Statewide Parcel Database (V12, 2026). Values shown exactly as submitted by the county.'));


}

function renderNotice(title, message, kind = 'info') {
    const c = openCard();
    c.append(el('div', 'card-kicker', 'Property Intelligence Card'));
    c.append(el('div', 'card-title', title));
    c.append(el('div', `banner ${kind}`, message));
}

function showNoParcel(lat, lng) {
    setStatus('No parcel polygon at this point.');
    renderNotice('No parcel at this point',
        `No tax parcel polygon in the statewide layer contains ${lat.toFixed(5)}, ${lng.toFixed(5)}. This is usually road or railroad right-of-way, open water, or an area missing from the county's submission. Nothing was substituted. Switch to Aerial or zoom in to see the nearest parcel lines.`);
}

function showError(message) {
    setStatus('Lookup failed. No data shown.', true);
    renderNotice('Lookup failed', `The parcel query did not complete, so no parcel information is shown. ${message}`, 'err');
}

// ---- Parcel intelligence (Phase 1: ownership, MFL, soils) ----------------
let intelSeq = 0;

async function loadIntel(feature, box) {
    const seq = ++intelSeq;
    box.replaceChildren(el('div', 'loading', 'Checking ownership, MFL enrollment and soils…'));
    const objectId = feature.id ?? feature.properties.OBJECTID;
    try {
        const out = await window.localEvaluate({ objectId, parcelId: feature.properties.PARCELID || null });
        const data = out.data || {};
        if (seq !== intelSeq) return;
        if (out.code !== 200) throw new Error(data.error || `Lookup returned status ${out.code}.`);
        box.replaceChildren();
        renderLead(box, data.lead, data.ownership);
        renderMfl(box, data.mfl);
        renderComps(box, data.comps);
        renderSoils(box, data.soils);
        renderSources(box, data.sources);
    } catch (e) {
        if (seq !== intelSeq) return;
        box.replaceChildren(el('div', 'banner err', `Ownership / MFL / soils lookup failed. Nothing is shown for these sections. ${e.message}`));
    }
}

function signal(parent, met, label, detail) {
    const row = el('div', 'sig');
    const [icon, cls] = met === true ? ['✓', 'sig-yes'] : met === false ? ['✗', 'sig-no'] : ['?', 'sig-unk'];
    row.append(el('div', `sig-icon ${cls}`, icon), el('div', null, label));
    if (detail) row.append(el('div', 'sig-detail', detail));
    parent.append(row);
}

function renderLead(box, lead, ownership) {
    box.append(el('div', 'section', 'Acquisition lead signals'));
    for (const c of lead.criteria) signal(box, c.met, c.label, c.detail);
    if (lead.allCriteriaMet) box.append(el('div', 'banner info', 'Meets all three lead criteria.'));
    for (const x of lead.expiringEnrollments) {
        box.append(el('div', 'banner warn', `MFL order ${x.orderNo} expires ${x.expires} (${x.yearsRemaining} yr${x.yearsRemaining === 1 ? '' : 's'}). Expiring enrollments are acquisition opportunities.`));
    }
    if (ownership && ownership.reasons && ownership.reasons.length) {
        box.append(el('div', 'fine', `Owner status: ${ownership.reasons.join(' ')}`));
    }
    box.append(el('div', 'fine', lead.note));
}

function orderItem(o, matched) {
    const item = el('div', 'item');
    item.append(el('div', 'item-title', `${o.program || 'Tax law'} order ${o.orderNo || '(no number)'}`));
    const acres = o.orderAcres || {};
    const parts = [
        o.entryYear && `Entered ${o.entryYear}`,
        o.expires && `Expires ${o.expires}${o.yearsRemaining !== null ? ` (${o.yearsRemaining} yr left)` : ''}`,
        acres.total !== null && acres.total !== undefined && `Order: ${acres.total} ac (${acres.open ?? 0} open / ${acres.closed ?? 0} closed)`,
        o.ownerType && `Owner type: ${o.ownerType}`,
        matched ? `Matched by ${o.match}` : `≈${o.nearestMeters} m from parcel, not confirmed`
    ].filter(Boolean);
    item.append(el('div', 'item-meta', parts.join(' · ')));
    const tracts = o.tracts.filter(t => matched ? t.match : true).slice(0, 4);
    for (const t of tracts) {
        item.append(el('div', 'item-meta', `• ${t.description || 'Tract'}${t.acres !== null ? ` · ${t.acres} ac` : ''}${t.access ? ` · ${t.access}` : ''}${t.countyParcelNo ? ` · county parcel ${t.countyParcelNo}` : ''}`));
    }
    return item;
}

function renderMfl(box, mfl) {
    box.append(el('div', 'section', 'Managed Forest Law / Forest Crop'));
    if (!mfl.ok) { box.append(el('div', 'banner err', `Enrollment check failed: ${mfl.error}`)); return; }
    if (mfl.status === 'enrolled') {
        for (const o of mfl.matched) box.append(orderItem(o, true));
    } else {
        box.append(el('div', null, 'No MFL or Forest Crop enrollment matched this parcel.'));
    }
    if (mfl.nearby.length) {
        const d = el('details');
        d.append(el('summary', null, `${mfl.nearby.length} other enrollment(s) within ${mfl.searchRadiusMeters} m (not confirmed for this parcel)`));
        for (const o of mfl.nearby) d.append(orderItem(o, false));
        box.append(d);
    }
    if (mfl.truncated) box.append(el('div', 'banner warn', 'The DNR service returned only part of the nearby enrollments.'));
    box.append(el('div', 'fine', mfl.method));
}

const usd = (v) => '$' + Math.round(v).toLocaleString('en-US');

function renderComps(box, comps) {
    box.append(el('div', 'section', 'Comparable land sales'));
    if (!comps || !comps.ok) { box.append(el('div', 'banner err', `Comparable sales lookup failed: ${comps ? comps.error : 'no response'}`)); return; }
    const cov = comps.coverage && comps.coverage.from ? `Sales data loaded: ${comps.coverage.from} to ${comps.coverage.to}.` : '';
    if (comps.status !== 'ok') { box.append(el('div', 'pending', `${comps.note} ${cov}`)); return; }

    const ppa = comps.pricePerAcre;
    const dl = el('dl');
    dl.append(el('dt', null, 'Median price / acre'), el('dd', null, usd(ppa.median)));
    if (ppa.p25 !== null) dl.append(el('dt', null, 'Middle half'), el('dd', null, `${usd(ppa.p25)} – ${usd(ppa.p75)} / ac`));
    dl.append(el('dt', null, 'Full range'), el('dd', null, `${usd(ppa.min)} – ${usd(ppa.max)} / ac`));
    dl.append(el('dt', null, 'Based on'), el('dd', null, `${comps.count} sale${comps.count === 1 ? '' : 's'} within ${comps.radiusMiles} mi${comps.sizeMatched ? ', similar size' : ''}`));
    box.append(dl);
    if (comps.count < 5) box.append(el('div', 'banner warn', `Only ${comps.count} comparable sale(s) found. Treat this as thin evidence.`));

    const d = el('details');
    d.append(el('summary', null, `Show the ${comps.count} sale${comps.count === 1 ? '' : 's'}`));
    for (const c of comps.comps) {
        const item = el('div', 'item');
        item.append(el('div', 'item-title', `${usd(c.pricePerAcre)}/ac · ${c.acres} ac · ${usd(c.price)}`));
        item.append(el('div', 'item-meta', [c.date, c.municipality, `${c.county} Co.`, `${c.distanceMiles} mi`].filter(Boolean).join(' · ')));
        item.append(el('div', 'item-meta', [c.use, c.mflAcres ? `${c.mflAcres} ac MFL` : null, c.waterFt ? `${c.waterFt} ft water frontage` : null, c.plss, c.parcel && `parcel ${c.parcel}`].filter(Boolean).join(' · ')));
        d.append(item);
    }
    box.append(d);
    box.append(el('div', 'fine', `Arm's-length, land-only sales of forest or undeveloped land from WI DOR transfer returns. ${comps.method} ${cov} Market evidence, not an appraisal.`));
}

function renderSoils(box, soils) {
    box.append(el('div', 'section', 'Soils & site productivity'));
    if (!soils.ok) { box.append(el('div', 'banner err', `Soils lookup failed: ${soils.error}`)); return; }
    if (soils.note) box.append(el('div', soils.status === 'none' ? null : 'banner warn', soils.note));
    if (!soils.units.length) return;

    if (soils.productivity.length) {
        const dl = el('dl');
        for (const s of soils.productivity.slice(0, 6)) {
            dl.append(el('dt', null, s.species || s.symbol || 'Unknown species'));
            dl.append(el('dd', null, `Site index ${s.siteIndex} · ${s.ratedAcres} ac rated${s.productivityFt3AcYr !== null ? ` · ${s.productivityFt3AcYr} ft³/ac/yr` : ''}`));
        }
        box.append(dl);
        box.append(el('div', 'fine', 'Area-weighted across the soil components rated for each species (SSURGO site index, base age per the listed method).'));
    } else {
        box.append(el('div', 'pending', 'No forest productivity ratings published for these soils.'));
    }

    const d = el('details');
    d.append(el('summary', null, `${soils.units.length} soil map unit(s)${soils.totalAcres ? ` · ${soils.totalAcres} ac total` : ''}`));
    for (const u of soils.units) {
        const item = el('div', 'item');
        item.append(el('div', 'item-title', `${u.symbol ? u.symbol + ' · ' : ''}${u.name || 'Unnamed map unit'}`));
        item.append(el('div', 'item-meta', [
            u.acres !== null && `${u.acres} ac${u.percentOfParcel !== null ? ` (${u.percentOfParcel}%)` : ''}`,
            u.drainage && `Drainage: ${u.drainage}`
        ].filter(Boolean).join(' · ') || 'Area not available'));
        const majors = u.components.filter(c => c.major);
        for (const c of majors) {
            const si = c.siteIndex.map(s => `${s.species || s.symbol} SI ${s.siteIndex}`).join(', ');
            item.append(el('div', 'item-meta', `• ${c.name}${c.percent !== null ? ` ${c.percent}%` : ''}${si ? ': ' + si : ''}`));
        }
        d.append(item);
    }
    box.append(d);
}

function renderSources(box, sources) {
    if (!sources || !sources.length) return;
    const f = el('div', 'fine', 'Sources: ');
    sources.forEach((s, i) => {
        const a = el('a', null, s.name);
        a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
        f.append(a);
        if (i < sources.length - 1) f.append(document.createTextNode(' · '));
    });
    box.append(f);
}

// ---- AI summary ----------------------------------------------------------
async function runSummary(p, btn, out) {
    btn.disabled = true;
    btn.textContent = 'Generating…';
    out.replaceChildren();
    const parcel = {};
    for (const k of FACT_FIELDS) parcel[k] = k === 'LOADDATE' ? dateText(p[k]) : (p[k] ?? null);
    try {
        const res = await fetch('/api/summary', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ parcel }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.summary) throw new Error(data.error || `Server returned HTTP ${res.status}.`);
        out.append(el('div', 'section', 'AI field summary'), el('div', 'ai', data.summary),
            el('div', 'fine', 'Generated only from the record above. Any figure not found in that record is rejected by the server.'));
        btn.remove();
    } catch (e) {
        out.append(el('div', 'banner err', e.message));
        btn.disabled = false;
        btn.textContent = 'Retry AI field summary';
    }
}

// ---- Inputs -------------------------------------------------------------
map.on('click', (e) => lookupPoint(e.latlng.lat, e.latlng.lng, null));

gpsBtn.addEventListener('click', () => {
    if (!('geolocation' in navigator)) { setStatus('This browser does not provide GPS location.', true); return; }
    if (!window.isSecureContext) { setStatus('GPS requires the app to be opened over HTTPS.', true); return; }
    gpsBtn.disabled = true;
    setStatus('Acquiring GPS fix…');
    navigator.geolocation.getCurrentPosition((pos) => {
        gpsBtn.disabled = false;
        const { latitude, longitude, accuracy } = pos.coords;
        map.setView([latitude, longitude], Math.max(map.getZoom(), 17));
        lookupPoint(latitude, longitude, accuracy);
    }, (err) => {
        gpsBtn.disabled = false;
        const messages = {
            1: 'Location permission denied. Allow location for this site in your browser settings.',
            2: 'Position unavailable. Move toward open sky, or tap the map to drop a pin.',
            3: 'GPS timed out after 20 seconds. Try again, or tap the map to drop a pin.'
        };
        setStatus(messages[err.code] || err.message, true);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
});

$('idForm').addEventListener('submit', (e) => {
    e.preventDefault();
    lookupParcelId($('idInput').value);
});

setStatus('Tap "Use My GPS Location", tap the map, or search a Parcel ID.');
</script>
